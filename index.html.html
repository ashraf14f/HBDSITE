<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Sondoss</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fb5;--purple:#8e5cf0;--gold:#ffc93c;--sky:#7fd3ff;--ink:#3a1c71;--bg1:#ffd1ec;--bg2:#d9c2ff;--bg3:#c4ecff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a1f63;--bg2:#2d2475;--bg3:#1d4a73;--ink:#fff}}
:root[data-theme="dark"]{--bg1:#4a1f63;--bg2:#2d2475;--bg3:#1d4a73;--ink:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);overflow:hidden;
 background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:300% 300%;
 animation:bg 14s ease infinite;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@keyframes bg{50%{background-position:100% 50%}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:0}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh}
.title{font-family:'Pacifico',cursive;font-size:clamp(2.2rem,10vw,5.5rem);text-align:center;color:#fff;letter-spacing:.02em;
 text-shadow:0 0 12px var(--gold),0 0 28px var(--pink),0 0 48px var(--purple);opacity:0;transform:translateY(20px) scale(.8);
 position:absolute;top:clamp(40px,9vh,90px);left:0;right:0;pointer-events:none}
.show .title{animation:titleIn 1.2s 1.7s cubic-bezier(.2,1.4,.4,1) forwards,glow 2.4s 2.9s ease-in-out infinite alternate}
@keyframes titleIn{to{opacity:1;transform:none}}
@keyframes glow{to{text-shadow:0 0 20px var(--gold),0 0 44px var(--pink),0 0 80px var(--purple)}}
.scene{position:relative;width:min(72vw,300px);aspect-ratio:1/1.15;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scene:focus-visible{outline:4px solid var(--gold);outline-offset:10px;border-radius:16px}
/* box */
.box{position:absolute;left:0;right:0;bottom:0;height:56%;border-radius:6px 6px 14px 14px;z-index:3;
 background:linear-gradient(90deg,#b34bff,#8e5cf0);box-shadow:0 18px 30px rgba(60,20,120,.35);animation:bob 2.2s ease-in-out infinite}
.box::before{content:"";position:absolute;left:44%;width:12%;top:0;bottom:0;background:var(--gold)}
.box::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 20% 30%,#fff3 0 6px,transparent 7px) 0 0/34px 34px}
.lid{position:absolute;left:-5%;right:-5%;bottom:52%;height:16%;border-radius:8px;z-index:5;transform-origin:left bottom;
 background:linear-gradient(90deg,#ff6fb5,#ff93ca);box-shadow:0 6px 12px rgba(60,20,120,.25);animation:bob 2.2s ease-in-out infinite}
.lid::before{content:"";position:absolute;left:47%;width:11%;top:0;bottom:0;background:var(--gold)}
.lid::after{content:"";position:absolute;left:50%;top:-70%;width:34%;height:80%;transform:translateX(-50%);
 background:radial-gradient(circle at 25% 60%,var(--gold) 0 34%,transparent 36%),radial-gradient(circle at 75% 60%,var(--gold) 0 34%,transparent 36%)}
@keyframes bob{50%{transform:translateY(-6px)}}
.show .box,.show .lid{animation:none}
.show .lid{animation:lid 1.1s cubic-bezier(.5,-.3,.5,1.2) forwards}
@keyframes lid{40%{transform:translateY(-30px) rotate(-8deg)}100%{transform:translate(-90%,60px) rotate(-70deg);opacity:0}}
/* cake */
.cake{position:absolute;left:8%;right:8%;bottom:30%;height:64%;z-index:2;transform:translateY(60%) scale(.3);opacity:0}
.show .cake{animation:pop 1.3s .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:translateY(0) scale(1);opacity:1}}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:10px}
.t1{bottom:0;width:100%;height:42%;background:linear-gradient(#ffb3d9,#ff6fb5)}
.t2{bottom:38%;width:74%;height:34%;background:linear-gradient(#e0ccff,#a47bf5)}
.drip{position:absolute;left:0;right:0;top:0;height:30%;border-radius:10px 10px 0 0;
 background:radial-gradient(circle at 10px 100%,#fff 0 9px,transparent 10px) 0 0/22px 100%,#fff;opacity:.95}
.dots{position:absolute;left:6%;right:6%;bottom:14%;height:8px;
 background:radial-gradient(circle,var(--gold) 0 3px,transparent 4px) 0 0/16px 8px}
.candles{position:absolute;bottom:68%;left:22%;right:22%;display:flex;justify-content:space-between}
.candle{position:relative;width:7px;height:clamp(22px,7vw,34px);background:repeating-linear-gradient(135deg,#fff 0 5px,var(--sky) 5px 10px);border-radius:2px}
.flame{position:absolute;left:50%;bottom:100%;width:12px;height:20px;margin-left:-6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
 background:radial-gradient(circle at 50% 70%,#fff 0 20%,var(--gold) 45%,#ff8a1f);box-shadow:0 0 14px 4px #ffc93caa;
 transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
.candle:nth-child(2) .flame{animation-delay:.1s}.candle:nth-child(3) .flame{animation-delay:.2s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.1) rotate(3deg)}}
.hint{margin-top:28px;font-weight:700;font-size:clamp(1.1rem,4.5vw,1.6rem);text-align:center;animation:pulse 1.4s ease-in-out infinite;transition:opacity .4s}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.show .hint{animation:none;opacity:0;pointer-events:none;height:0;margin:0}
.show .scene{cursor:default}
/* balloons */
#balloons{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.balloon{position:absolute;bottom:-160px;width:var(--s);height:calc(var(--s)*1.22);border-radius:50% 50% 48% 48%/55% 55% 45% 45%;
 background:radial-gradient(circle at 32% 28%,#fff9 0 8%,transparent 22%),var(--c);animation:rise var(--d) linear var(--delay) infinite;opacity:.92}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:70px;background:#ffffffaa}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(18px,-30vh)}50%{transform:translate(-14px,-65vh)}75%{transform:translate(16px,-100vh)}100%{transform:translate(0,-135vh)}}
@media (prefers-reduced-motion:reduce){body,.balloon,.hint,.box,.lid,.flame{animation-duration:0s!important}.balloon{display:none}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="balloons" aria-hidden="true"></div>
<main class="stage" id="stage">
  <h1 class="title">HBD SONDOSS</h1>
  <div class="scene" id="scene" role="button" tabindex="0" aria-label="Open your birthday gift">
    <div class="cake" aria-hidden="true">
      <div class="candles"><div class="candle"><i class="flame"></i></div><div class="candle"><i class="flame"></i></div><div class="candle"><i class="flame"></i></div></div>
      <div class="tier t2"><div class="drip"></div></div>
      <div class="tier t1"><div class="drip"></div><div class="dots"></div></div>
    </div>
    <div class="lid"></div>
    <div class="box"></div>
  </div>
  <p class="hint" id="hint">Click to open your gift!</p>
</main>
<script>
const stage=document.getElementById('stage'),scene=document.getElementById('scene');
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
const cols=['#ff6fb5','#8e5cf0','#ffc93c','#7fd3ff'];
let W,H,bits=[],burst=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size);size();
for(let i=0;i<50;i++)bits.push({x:Math.random()*W,y:Math.random()*H,r:3+Math.random()*4,v:.3+Math.random()*.6,c:cols[i%4]});
function spawnBurst(){for(let i=0;i<110;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
 burst.push({x:W/2,y:H*.6,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:4+Math.random()*4,c:cols[i%4],l:140})}}
(function loop(){cx.clearRect(0,0,W,H);
 bits.forEach(b=>{b.y+=b.v;if(b.y>H+10){b.y=-10;b.x=Math.random()*W}cx.globalAlpha=.4;cx.fillStyle=b.c;cx.fillRect(b.x,b.y,b.r,b.r)});
 burst=burst.filter(p=>p.l-->0);burst.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
 requestAnimationFrame(loop)})();
function balloons(){const w=document.getElementById('balloons'),bc=['#ff6fb5','#8e5cf0','#ffc93c','#7fd3ff','#ff93ca'];
 for(let i=0;i<16;i++){const b=document.createElement('div');b.className='balloon';
  b.style.cssText=`left:${3+i*6}%;--s:${46+Math.random()*34}px;--c:${bc[i%5]};--d:${9+Math.random()*7}s;--delay:${i*.45}s`;w.appendChild(b)}}
let opened=false;
function open(){if(opened)return;opened=true;stage.classList.add('show');scene.removeAttribute('tabindex');scene.setAttribute('aria-label','Birthday cake');
 setTimeout(spawnBurst,600);setTimeout(balloons,1000);setTimeout(spawnBurst,1900)}
scene.addEventListener('click',open);
scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
</script>
</body>
</html>
